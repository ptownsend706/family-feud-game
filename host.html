<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Family Feud • TV Board</title><link rel="stylesheet" href="style.css"></head><body><header><h1>★ FAMILY FEUD ★</h1><div class="small">Family Game Night</div></header><main class="wrap"><div class="bar"><button id="sound">🔊 Enable TV Sound</button><button id="theme">▶ Play Opening Music</button><span id="status" class="status">Connecting…</span></div><div class="scores"><div class="panel score"><span id="team0">Team 1</span><strong id="score0">0</strong></div><div class="panel score"><span id="team1">Team 2</span><strong id="score1">0</strong></div></div><section class="panel"><div id="round" class="small">ROUND 1</div><div id="question" class="question">Loading game…</div><div id="answers" class="answers"></div><div id="strikes" class="strikes"></div></section><div class="small">Host controls are private at host.html • Original practice answers, not survey data</div></main><audio id="goodAnswerAudio" src="family-feud-good-answer.mp3" preload="auto"></audio><audio id="wrongAnswerAudio" src="family-feud-wrong-answer-buzzer.mp3" preload="auto"></audio><audio id="openingAudio" src="Family Feud - Harvey Era.mp3" preload="auto" loop></audio><script type="module">
import {path,onValue} from './shared.js';
let prev=null,enabled=false,ctx=null,lastMusicId=null,currentFastTimerEnd=0,previousScheduledEnd=0;
const $=id=>document.getElementById(id);
function tone(freq,duration,type='sine',volume=.08){if(!enabled)return;ctx=ctx||new(window.AudioContext||window.webkitAudioContext)();ctx.resume();let o=ctx.createOscillator(),g=ctx.createGain();o.type=type;o.frequency.value=freq;g.gain.value=volume;o.connect(g);g.connect(ctx.destination);o.start();g.gain.exponentialRampToValueAtTime(.001,ctx.currentTime+duration);o.stop(ctx.currentTime+duration)}
function playGoodAnswer(){const audio=$('goodAnswerAudio');if(!enabled)return;audio.pause();audio.currentTime=0;audio.play().catch(()=>{});}
function cheer(){[440,554,659,880].forEach((f,i)=>setTimeout(()=>tone(f,.22),i*105))}
function buzzer(){if(!enabled)return;const a=$('wrongAnswerAudio');a.pause();a.currentTime=0;a.play().catch(()=>{})}
// Plays the audio file supplied by the host, rather than a synthesized tune.
const openingAudio=$('openingAudio');
function stopTheme(){openingAudio.pause();openingAudio.currentTime=0;$('theme').textContent='▶ Play Opening Music'}
async function playTheme(){
 if(!openingAudio.paused){stopTheme();return}
 enabled=true;$('sound').textContent='🔊 Sound On';
 try{await openingAudio.play();$('theme').textContent='■ Stop Opening Music'}
 catch(e){$('status').textContent='Music unavailable — check Family Feud - Harvey Era.mp3 is uploaded';}
}
openingAudio.addEventListener('error',()=>{$('status').textContent='Theme audio file not found';});
$('theme').onclick=playTheme;
$('sound').onclick=()=>{enabled=!enabled;$('sound').textContent=enabled?'🔊 Sound On':'🔇 Enable TV Sound';if(!enabled)stopTheme();else cheer()};
function el(tag,cls,txt){let e=document.createElement(tag);if(cls)e.className=cls;if(txt!==undefined)e.textContent=txt;return e}
function render(s){
const command=s.musicCommand;
if(command && command.id!==lastMusicId){
 if(lastMusicId!==null){if(command.action==='play'){if(openingAudio.paused)playTheme()}else if(command.action==='stop')stopTheme()}
 lastMusicId=command.id;
}
if(s.phase==='fast'||(prev&&s.round!==prev.round)||(prev&&s.questionVisible===true&&prev.questionVisible!==true))stopTheme();$('status').textContent='Connected • TV display';[0,1].forEach(i=>{$('team'+i).textContent=s.teamNames[i];$('score'+i).textContent=s.scores[i]});let fast=s.phase==='fast';$('round').textContent=fast?'FAST MONEY — PLAYER '+(s.fastPlayer||1):'ROUND '+(s.round+1)+(s.round>=6?' • TRIPLE POINTS':s.round>=3?' • DOUBLE POINTS':'');$('strikes').textContent=fast?'':('❌'.repeat(s.strikes||0));let list=fast?s.fastQuestions:[s.currentRound];$('answers').replaceChildren();if(fast){
  const timer=s.fastTimer||{status:'ready',endsAt:0};
  $('answers').style.display='block';
  if(timer.status==='review'){
    $('question').textContent='FAST MONEY — RESULTS';
    list.forEach((q,i)=>{
      if(i>=(s.reviewCount||0))return;
      const r=el('div','fastrow');
      r.append(el('strong','',`${i+1}. ${q[0]}`));
      r.append(el('div','',`Top answer: ${q[1][0]} — ${q[1][1]} points`));
      r.append(el('div','',`Player 1: ${q[2][0]} — ${q[2][1]} points`));
      r.append(el('div','',`Player 2: ${q[3][0]} — ${q[3][1]} points`));
      $('answers').append(r);
    });
    if((s.reviewCount||0)>=list.length){
      const scores=s.fastScores||[0,0];
      $('strikes').textContent=`PLAYER 1: ${scores[0]} • PLAYER 2: ${scores[1]} • TOTAL: ${scores[0]+scores[1]} / 200`;
    }else $('strikes').textContent='';
  }else{
    $('question').textContent='';
    $('strikes').textContent='';
    const timerEl=el('div','fast-countdown','00:25');
    timerEl.style.cssText='font-size:clamp(72px,15vw,170px);font-weight:900;text-align:center;line-height:1.4;font-variant-numeric:tabular-nums';
    $('answers').append(timerEl);
    function tick(){
      const remaining=timer.status==='running'?Math.max(0,Math.ceil((timer.endsAt-Date.now())/1000)):25;
      timerEl.textContent=(timer.status==='finished'||(timer.status==='running'&&remaining===0))?"TIME'S UP!":`00:${String(remaining).padStart(2,'0')}`;
      if(timerEl.textContent==="TIME'S UP!")timerEl.style.fontSize='clamp(40px,8vw,100px)';
    }
    tick();
    window.clearInterval(window.fastTimerInterval);
    window.fastTimerInterval=window.setInterval(tick,100);
    if(timer.status==='running'&&timer.endsAt>Date.now()&&timer.endsAt!==previousScheduledEnd){previousScheduledEnd=timer.endsAt;
      window.setTimeout(()=>{if(currentFastTimerEnd===timer.endsAt){tick();buzzer()}},timer.endsAt-Date.now());
    }
    currentFastTimerEnd=timer.endsAt;
  }
}else{$('answers').style.display='grid';let q=list[0];$('question').textContent=s.questionVisible===true?q[0]:'🎤 Question hidden — waiting for host';q[1].forEach(([answer,points],i)=>{let shown=(s.revealed||[]).includes(i),tile=el('div','tile'+(shown?'':' hidden'));tile.append(el('span','num',String(i+1)));if(shown){tile.append(el('span','',answer),el('span','pts',String(points)))}$('answers').append(tile)})}
if(prev){if((s.strikes||0)>(prev.strikes||0)&&!fast)buzzer();if(!fast&&(s.revealed||[]).some(i=>!(prev.revealed||[]).includes(i)))playGoodAnswer();if(fast&&s.fastTimer?.status==='review'&&(s.reviewCount||0)>(prev.reviewCount||0))playGoodAnswer()}prev=s}
onValue(path,snap=>{let s=snap.val();if(s)render(s);else $('status').textContent='Waiting for host to initialize game…'},err=>$('status').textContent='Connection error: '+err.message);
</script></body></html>
